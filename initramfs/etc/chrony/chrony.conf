# Client-only time synchronization; no NTP server or UDP command listener.
pool pool.ntp.org iburst
makestep 1.0 3
driftfile /run/chrony/drift
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
port 0
cmdport 0
# No rtcsync: PM660 RTC is write-disabled. No SHM refclock on this kernel.
