# Client-only time synchronization; no NTP server or UDP command listener.
pool pool.ntp.org iburst
# GPS time from gpsd (started by gps-manager while a lease is held) through
# NTP SHM unit 0: root-only 0600, attached by chronyd before it drops to the
# chrony user and by gpsd before it drops to nobody. NMEA arrival time, no
# PPS: gpsd latches the first timed sentence of each 1 Hz burst (GGA, after
# the GSVs). On 2026-10-04 that was 13 ms behind NTP over Wi-Fi, with under
# 1 ms jitter. The pool servers disagreed by up to 55 ms, so this is a coarse
# source. delay 1.0 makes its root distance ~0.5 s: the pool servers seen
# (+/-20..140 ms) were selected and GPS was not combined. A server between
# ~170 ms and 0.5 s would get GPS combined; only one worse than 0.5 s would
# lose to GPS.
refclock SHM 0 refid GPS offset 0.013 delay 1.0 precision 1e-3
# Step any correction over 1 s, at any time, not only in the first updates:
# the RTC is not the wall clock (chef-state restores the time from a saved
# RTC offset when it can, unverified), so the clock may boot at 1970 or
# seconds off, and GPS may arrive long after chronyd starts or after a
# source that was off by seconds. Smaller corrections (GPS against NTP) are
# slewed.
makestep 1.0 -1
# /var/lib/chrony is /data/v1/chrony when /data is ours (chef-storage), so
# the frequency estimate survives a reboot; chronyd writes it about hourly
# and on exit, and chef-state stops chronyd before /data goes read-only.
driftfile /var/lib/chrony/drift
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
port 0
cmdport 0
# No rtcsync: PM660 RTC is write-disabled.
