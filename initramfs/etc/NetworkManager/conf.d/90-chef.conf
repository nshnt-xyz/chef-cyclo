[main]
plugins=keyfile
dhcp=internal
dns=default
# /etc/resolv.conf is a link to NetworkManager's own /run/NetworkManager/resolv.conf
# (the root is read-only); NM must not try to write /etc.
rc-manager=unmanaged
hostname-mode=none
no-auto-default=*
auth-polkit=root-only

[keyfile]
# Strictly exclude USB, loopback and WWAN; manage only the WLAN device and
# Bluetooth devices (NM type "bt", for PAN client profiles). The bnep+
# ingress rule keeps a PANU link off the USB subnet; it does not cover a NAP
# bridge, and the overlap dispatcher does not check bnep* leases yet.
unmanaged-devices=*,except:interface-name:wlan0,except:type:bt
path=/run/NetworkManager/system-connections

[device-chef-wifi]
match-device=interface-name:wlan0
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=preserve
