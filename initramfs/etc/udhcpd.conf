# DHCP for the USB host. "interface" is rewritten by /init if the gadget
# interface isn't usb0. No router/dns options: the host must not route
# through the phone.
interface usb0
start 172.16.42.2
end 172.16.42.9
max_leases 8
lease_file /tmp/udhcpd.leases
option subnet 255.255.255.0
option lease 864000
