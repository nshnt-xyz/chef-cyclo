# DHCP for the USB host. A copy with the actual gadget interface is written to
# /run/udhcpd.conf at boot (usr/lib/chef/usb-gadget.sh). No router/dns
# options: the host must not route through the phone.
interface usb0
start 172.16.42.2
end 172.16.42.9
max_leases 8
lease_file /tmp/udhcpd.leases
option subnet 255.255.255.0
option lease 864000
