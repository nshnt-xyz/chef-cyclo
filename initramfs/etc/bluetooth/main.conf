# chef-cyclo bluetoothd configuration (overrides Alpine's defaults file).
[General]
Name = chef-cyclo
# BlueZ's default. Classic (BR/EDR) data such as A2DP media, rfcomm, PAN and
# HID is ACL over the UART like LE; only HFP's SCO voice would need the board
# PCM path, which is not wired up.
ControllerMode = dual

[Policy]
# Power the adapter on as soon as btattach registers it.
AutoEnable = true
