# mke2fs features for the read-only system_a root (scripts/mksystem.sh):
# explicit and supported by the phone's 4.4 kernel; nothing inherited from
# the host's distribution defaults. No journal (never mounted writable), no
# uninit_bg/metadata_csum (every group and inode table written in full).
[defaults]
    base_features = sparse_super,large_file,filetype,dir_index,ext_attr
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
[fs_types]
    ext4 = {
        features = extent,huge_file,flex_bg,dir_nlink,extra_isize
    }
