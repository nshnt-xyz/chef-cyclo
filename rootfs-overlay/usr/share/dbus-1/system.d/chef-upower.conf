<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- upowerd runs as user upower (the OpenRC service upower,
     docs/features/users-and-permissions.md). The package's
     org.freedesktop.UPower.conf stays as shipped: root may own the name,
     everyone may call it. This file only adds the owner. -->
<busconfig>
  <policy user="upower">
    <allow own="org.freedesktop.UPower"/>
  </policy>
</busconfig>
