# chef-cyclo policy for WirePlumber, if someone installs PipeWire
# (apk add pipewire wireplumber pipewire-spa-bluez): Bluetooth audio only.
#
# The ALSA monitor stays off. The board card (sdm660-snd-card, after
# audio-up) drives the loudspeaker, whose limits (-6 dBFS ceiling, DAC
# volume <= 15) and mmap-only playback are kept by audio-up/tinyplay, not by
# PipeWire; WirePlumber would otherwise route any stream to it. The cameras
# (v4l2/libcamera) are not for PipeWire either.
wireplumber.profiles = {
  main = {
    hardware.audio = disabled
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    hardware.video-capture = disabled
  }
}

# A2DP source only: the phone sends audio to headphones or speakers. Being
# an A2DP sink would loop received audio back out over Bluetooth, and
# HFP/HSP voice needs the board PCM path, which is not wired up.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source ]
  bluez5.hfphsp-backend = "none"
}
