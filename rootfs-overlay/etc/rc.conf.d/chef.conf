# Our OpenRC settings, beside the package's /etc/rc.conf (kept as shipped).
# Every openrc-run reads this after rc.conf and before the service's
# conf.d file, so the packaged services get these values too. See
# docs/features/services.md.

# Serial and deterministic: one service at a time, in dependency order
# (rc.conf itself warns that a parallel start can lock the boot).
rc_parallel="NO"
# No "press I" prompt: there is no console to answer it.
rc_interactive="NO"
# OpenRC's own boot and shutdown output (each start and stop, with its
# failures) in /var/log/rc.log, on the volatile /var: one file per boot,
# readable from the shell.
rc_logger="YES"

# Every supervised daemon is respawned for as long as its service runs
# (respawn_max 0: no limit; the package's 5 would leave a crashing daemon
# down for good). supervise-daemon waits respawn_delay plus 128 ms for
# every earlier respawn in the current respawn_period (rc.conf: 1800 s),
# at most 30 s, so a daemon that keeps dying backs off instead of spinning.
respawn_delay="1s"
respawn_max=0

# A stop sends TERM, waits up to 5 s, then KILL and up to 2 s more, for
# the start-stop-daemon and the supervise-daemon services alike. Without
# it OpenRC gives up after the 5 s and leaves the process running.
retry="TERM/5/KILL/2"
