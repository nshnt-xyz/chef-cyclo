# UPower's configuration on chef-cyclo, the whole file (it replaces the
# package's; upowerd reads this plus UPower.conf.d, which we leave empty).
# UPower only reports here: powerd owns the low-battery and shutdown policy
# (docs/features/battery-and-charging.md), and UPower must never act. Its
# warning levels match powerd's (low at 15 %, critical at 5 %), and its
# critical action is Ignore. upowerd treats Ignore as a risky setting and
# logs one "considered risky" warning at every start: expected.
[UPower]
EnableWattsUpPro=false
IgnoreLid=true
UsePercentageForPolicy=true
PercentageLow=15.0
PercentageCritical=5.0
PercentageAction=2.0
AllowRiskyCriticalPowerAction=true
CriticalPowerAction=Ignore
